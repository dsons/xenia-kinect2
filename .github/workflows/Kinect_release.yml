name: Kinect release

# Builds the Kinect release zip. Run it from the Actions tab ("Run workflow")
# to get a build as an artifact; pushing a v* tag also publishes a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Name the build after the release
        if: startsWith(github.ref, 'refs/tags/v')
        # Xenia's title bar shows the branch, which a tag checkout lacks.
        run: git checkout -B "xenia-kinect2-$($env:GITHUB_REF_NAME.TrimStart('v'))"

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: ${{ runner.os }}-vulkan-sdk-kinect
          restore-keys: ${{ runner.os }}-vulkan-sdk-

      - name: Install Vulkan SDK
        run: |-
          if (-not (Test-Path "C:\VulkanSDK")) {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
            Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          }

      - name: Build Xenia, the Kinect runtime and the zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\kinect_release\build-all.ps1 -NoInstall

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xenia-kinect2-windows-x64
          path: |
            build/release/xenia-kinect2-*.zip
            build/release/xenia-kinect2-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |-
          $files = @(Get-ChildItem build\release -Filter 'xenia-kinect2-*.zip*' | ForEach-Object FullName) + 'Build-Xenia-Kinect2.cmd'
          gh release create $env:TAG @files --repo ${{ github.repository }} --title "Xenia with Kinect $($env:TAG.TrimStart('v'))" --notes-file tools\kinect_release\RELEASE_NOTES.md --latest
